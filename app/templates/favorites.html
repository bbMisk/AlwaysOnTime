{% extends "base.html" %}
{% block content %}
  <section>
    <h1>{{ t('My Favorites') or 'My Favorites' }}</h1>
    <p><a href="/">← {{ t('Back to Home') or 'Back to Home' }}</a></p>
  </section>
  
  <section>
    <div id="favorites-list">
      <div style="text-align: center; padding: 40px;">
        <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; color: #64748b;">{{ t('Loading favorites…') or 'Loading favorites…' }}</p>
      </div>
    </div>
  </section>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    
    .favorite-item {
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
      transition: all 0.2s;
    }
    
    .favorite-item:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    .favorite-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }
    
    .favorite-name {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
    }
    
    .favorite-lines {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    
    .line-badge-small {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 14px;
      color: white;
      min-width: 30px;
      text-align: center;
    }
    
    .line-1, .line-2, .line-3 { background: #EE352E; }
    .line-4, .line-5, .line-6 { background: #00933C; }
    .line-7 { background: #B933AD; }
    .line-s { background: #808183; }
    .line-a, .line-c, .line-e { background: #0039A6; }
    .line-b, .line-d, .line-f, .line-m { background: #FF6319; }
    .line-g { background: #6CBE45; }
    .line-j, .line-z { background: #996633; }
    .line-l { background: #A7A9AC; }
    .line-n, .line-q, .line-r, .line-w { background: #FCCC0A; color: #000; }
    
    .favorite-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    .favorite-actions a,
    .favorite-actions button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }
    
    .btn-view {
      background: #3b82f6;
      color: white;
    }
    
    .btn-view:hover {
      background: #2563eb;
    }
    
    .btn-remove {
      background: #ef4444;
      color: white;
    }
    
    .btn-remove:hover {
      background: #dc2626;
    }
    
    .no-favorites {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .no-favorites-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    @media (max-width: 768px) {
      .favorites-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    function loadFavorites() {
      fetch('/api/favorites')
        .then(response => response.json())
        .then(data => {
          displayFavorites(data.favorites || []);
        })
        .catch(error => {
          console.error('Error loading favorites:', error);
          document.getElementById('favorites-list').innerHTML = `
            <div class="error-message">
              <span>{{ t('Error loading favorites') or 'Error loading favorites' }}</span>
            </div>
          `;
        });
    }
    
    function displayFavorites(favorites) {
      const container = document.getElementById('favorites-list');
      
      if (favorites.length === 0) {
        container.innerHTML = `
          <div class="no-favorites">
            <div class="no-favorites-icon">⭐</div>
            <h3>{{ t('No favorites yet') or 'No favorites yet' }}</h3>
            <p>{{ t('Add stations to your favorites to see them here') or 'Add stations to your favorites to see them here' }}</p>
            <p><a href="/" style="color: #3b82f6;">{{ t('Browse stations') or 'Browse stations' }} →</a></p>
          </div>
        `;
        return;
      }
      
      let html = '<div class="favorites-grid">';
      
      favorites.forEach(fav => {
        const lines = fav.lines ? fav.lines.split(',').map(l => l.trim()) : [];
        const lineBadges = lines.map(line => {
          const lineClass = `line-${line.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
          return `<span class="line-badge-small ${lineClass}">${line}</span>`;
        }).join('');
        
        html += `
          <div class="favorite-item">
            <div class="favorite-header">
              <h3 class="favorite-name">${fav.station_name || 'Unknown Station'}</h3>
            </div>
            ${lineBadges ? `<div class="favorite-lines">${lineBadges}</div>` : ''}
            <div class="favorite-actions">
              <a href="/station/${fav.station_id}" class="btn-view">{{ t('View') or 'View' }}</a>
              <button onclick="removeFavorite(${fav.id})" class="btn-remove">{{ t('Remove') or 'Remove' }}</button>
            </div>
          </div>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    }
    
    function removeFavorite(favoriteId) {
      if (!confirm('{{ t("Are you sure you want to remove this favorite?") or "Are you sure you want to remove this favorite?" }}')) {
        return;
      }
      
      fetch(`/api/favorites/${favoriteId}`, {
        method: 'DELETE'
      })
      .then(response => {
        if (response.ok) {
          loadFavorites(); // Reload the list
        } else {
          alert('{{ t("Error removing favorite") or "Error removing favorite" }}');
        }
      })
      .catch(error => {
        console.error('Error removing favorite:', error);
        alert('{{ t("Error removing favorite") or "Error removing favorite" }}');
      });
    }
    
    // Load favorites on page load
    loadFavorites();
  </script>
{% endblock %}
